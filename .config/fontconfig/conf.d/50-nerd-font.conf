<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Nerd Font wiring for the terminal stack.

  JetBrainsMono Nerd Font is the terminal font, installed from the upstream
  release into ~/.local/share/fonts. Two things are needed beyond having the
  .ttf files installed:

  1. Anything that asks for the generic "monospace" family — Neovim, GUI
     toolkits, `fc-match monospace` — must land on the patched font, not on
     DejaVu, otherwise icons in those apps are tofu.

  2. Icons the patched font does not carry should fall back to the
     symbols-only font instead of whatever fontconfig finds first. Both are
     installed from the same release, so today the patched family is a
     superset (verified: zero extras in the symbols font); the fallback is
     the safety net for a stale patched font or a newer symbols release.
     Appending it *after* the main family keeps the main font's metrics
     authoritative.

  Symbols Nerd Font Mono (single-cell icons) is used rather than the
  proportional Symbols Nerd Font so terminal cell widths stay integers.
-->
<fontconfig>

  <!-- monospace -> the patched font -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>

  <!-- short name used by some editors/tools -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>JetBrainsMono NF</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>

  <!-- icon fallback, after the main family -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
    </edit>
  </match>

</fontconfig>
