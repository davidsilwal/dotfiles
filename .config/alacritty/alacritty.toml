# =============================================================================
#  Alacritty — Catppuccin Mocha
#  Generated by ~/.config/terminal-theme/install.sh
# =============================================================================

[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

[font]
size = 14.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
offset = { x = 0, y = 0 }

[window]
decorations = "full"
opacity = 0.94
padding = { x = 8, y = 6 }
dynamic_padding = true
dynamic_title = true
option_as_title = true

[cursor]
style = { shape = "block", blinking = "on" }
unfocused_hollow = true

[scrolling]
history = 100000
multiplier = 3

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#cba6f7"

[colors.selection]
text = "#cdd6f4"
background = "#585b70"

[colors.search]
matches = { foreground = "#1e1e2e", background = "#f9e2af" }
focused_match = { foreground = "#1e1e2e", background = "#b4befe" }

[colors.hints]
foreground = "#1e1e2e"
background = "#94e2d5"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"
