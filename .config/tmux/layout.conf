# =============================================================================
#  layout.conf — options that must win over the plugins
#
#  Loaded *after* TPM has run. tmux-sensible sets several options itself
#  (unconditionally for aggressive-resize), so anything it touches has to be
#  re-asserted here, otherwise the plugin silently wins.
# =============================================================================

# tmux-sensible turns this on whenever the terminal is not iTerm. With it on,
# the window is resized to the *smallest* attached client, so a stray or
# narrow client squashes the layout for everyone - a 52 column test client
# managed to squeeze a 186 column terminal down to 52 columns. Off means the
# window follows the largest client, which is what the terminal in front of
# you wants.
setw -g aggressive-resize off

# Escape delay: tmux-sensible sets the server-wide value to 0, which breaks
# the escape key in some full-screen applications. 10ms is responsive enough
# for vi-style bindings and still safe.
set -sg escape-time 10
set -g escape-time 10

# Emacs-style keys in the command prompt. Vim users still get vi keys in
# copy mode, but arrow keys and backspace behave predictably in `prefix + :`.
set -g status-keys emacs
