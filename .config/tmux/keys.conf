# =============================================================================
#  keys.conf — key bindings
#
#  Prefix is Ctrl-a (Ctrl-b still works as a secondary prefix).
#  Loaded last so these bindings win over the ones the plugins set.
# =============================================================================

# --- Prefix -----------------------------------------------------------------
unbind C-b
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix

# --- Reload -----------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "  reloaded  "
bind R source-file ~/.config/tmux/tmux.conf \; run '~/.tmux/plugins/tpm/tpm' \; display-message "  reloaded + plugins  "

# --- Help -------------------------------------------------------------------
bind ? display-popup -E -w 70% -h 85% -b rounded '~/.config/tmux/scripts/tmux-help.sh'

# --- Sessions ----------------------------------------------------------------
bind s display-popup -E -w 50% -h 60% -b rounded '~/.config/tmux/scripts/tmux-menu.sh'
bind C display-popup -E -w 50% -h 60% -b rounded '~/.config/tmux/scripts/tmux-new-session.sh'
bind X confirm-before -p "kill session #S? (y/n)" kill-session
bind Q confirm-before -p "kill all other sessions? (y/n)" 'run-shell ~/.config/tmux/scripts/tmux-kill-others.sh'
bind d detach-client

# --- Windows ----------------------------------------------------------------
bind c new-window -c '#{pane_current_path}'
bind , command-prompt -p 'rename window: ' "rename-window '%%'"
bind & confirm-before -p "kill window #W? (y/n)" kill-window
bind n next-window
bind p previous-window
bind w display-popup -E -w 60% -h 70% -b rounded '~/.config/tmux/scripts/tmux-menu.sh'
bind 0 select-window -t :0
bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8
bind 9 select-window -t :9

# --- Panes ------------------------------------------------------------------
unbind '"'
unbind %
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# vim-style navigation (repeatable: prefix h h h)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# vim-style resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# arrow-key navigation
bind -r Up    select-pane -U
bind -r Down  select-pane -D
bind -r Left  select-pane -L
bind -r Right select-pane -R

bind z resize-pane -Z
bind o select-pane -t '{next}'
bind ';' select-pane -t '{last}'
bind W swap-pane -D
bind q display-panes
bind '!' break-pane
bind x confirm-before -p "kill pane #{pane_index}? (y/n)" kill-pane
bind Space next-layout

# --- Copy mode & clipboard ---------------------------------------------------
bind '[' copy-mode
bind ']' paste-buffer
bind y copy-mode

# --- Popups ------------------------------------------------------------------
bind f display-popup -E -w 80% -h 80% -b rounded '~/.config/tmux/scripts/tmux-finder.sh'
bind g display-popup -E -w 80% -h 80% -b rounded '~/.config/tmux/scripts/tmux-git.sh'
bind T display-popup -E -w 80% -h 80% -b rounded '~/.config/tmux/scripts/tmux-scratch.sh'
bind S display-popup -E -w 50% -h 60% -b rounded '~/.config/tmux/scripts/tmux-ssh.sh'

# Smart picking: highlights URLs, paths, git SHAs and IPs in the pane.
bind F run-shell -b '~/.tmux/plugins/tmux-fingers/bin/tmux-fingers'

# Keys that work inside every popup. The binds come first: `bind` creates the
# popup table, `unbind` requires it to exist. The unbinds clear leftovers
# from an older configuration.
bind -T popup Escape send-keys Escape
bind -T popup q send-keys Escape
bind -T popup C-c send-keys C-c
bind -T popup Enter send-keys Enter
unbind -T popup T
unbind -T popup t
unbind -T popup C-[

# --- Misc --------------------------------------------------------------------
bind t display-message -d 3000 '  #S  %Y-%m-%d %H:%M  '

# --- Copy mode ---------------------------------------------------------------
# tmux-yank provides the clipboard integration. We keep its key layout but
# use tmux's own copy action, which fills the tmux buffer *and* pushes the
# selection to the system clipboard over OSC 52 (works over SSH, no xclip
# required).
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y send-keys -X copy-selection-and-cancel \; paste-buffer
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi r send-keys -X rectangle-begin
bind -T copy-mode-vi w send-keys -X copy-selection-and-cancel
bind -T copy-mode v send-keys -X begin-selection
bind -T copy-mode y send-keys -X copy-selection-and-cancel
bind -T copy-mode Y send-keys -X copy-selection-and-cancel \; paste-buffer
bind -T copy-mode q send-keys -X cancel
bind -T copy-mode Escape send-keys -X cancel
