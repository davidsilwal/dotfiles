# =============================================================================
#  options.conf — core tmux behaviour
# =============================================================================

# --- Terminal ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",screen*:Tc"
set -ga terminal-overrides ",tmux*:Tc"

# True colour + italics. The trailing ":sitm=\E[3m" makes the terminal honour
# italic escape sequences, which many CLI tools use for dimmed text.
set -ga terminal-overrides ",*:Tc:sitm=\E[3m"

# --- Extended keys (kitty keyboard protocol) --------------------------------
# Without this tmux warns "tmux extended-keys is off" and modified Enter keys
# (Shift+Enter, Ctrl+Enter) may not reach the application. The outer terminal
# must support the kitty keyboard protocol (CSI u) for this to take effect.
set -g extended-keys on
# Send extended keys in CSI u form. The xterm default (modifyOtherKeys) is
# lossy and collapses the distinction between keys such as Shift+Enter and
# Ctrl+Enter; pi and other TUI apps expect CSI u.
set -g extended-keys-format csi-u

# --- General behaviour ------------------------------------------------------
set -g mouse on                      # scroll, select, resize with the mouse
set -g history-limit 100000          # deep scrollback
set -g escape-time 10                # responsive Esc, still safe for vim/nvim
set -g focus-events on               # report focus changes to apps (TUI aware)
set -g repeat-time 600               # ms before a repeated prefix key repeats
set -g display-time 3000             # how long messages stay on screen
set -g status-interval 5             # status bar refresh interval (seconds)
set -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION DISPLAY XDG_CURRENT_DESKTOP"
set -g allow-passthrough on          # let apps send escape sequences through
set -g set-clipboard on              # OSC 52 clipboard (works over SSH)

# --- Windows & panes --------------------------------------------------------
set -g base-index 1                  # window numbering starts at 1
setw -g pane-base-index 1           # pane numbering starts at 1
set -g renumber-windows on           # close gaps when a window is killed
setw -g monitor-activity on          # flag windows with activity
# aggressive-resize makes the window shrink to the *smallest* attached
# client, so a stray or narrow client squashes everyone's layout. Off means
# the window follows the largest client, which is the right default when the
# main terminal is the one in front of you.
setw -g aggressive-resize off
# window-size must agree with the above, or the two fight each other.
#
# "latest" sizes the window to whichever client was attached most recently.
# Attach a second, narrower terminal and the window shrinks to it - while the
# wide client still believes it has 186 columns. tmux then paints the wide
# client's empty right-hand region with the pane scrollbar, so the screen
# fills with rows of "·", and the status bar is redrawn into a region that
# does not match its own width. The visible result is a pile of stacked-up
# footer bars.
#
# "largest" sizes the window to the biggest client, which is what
# aggressive-resize off already implies. Every client then gets a window
# that fits inside it, and nothing is painted past the window edge.
set -g window-size largest
set -g automatic-rename on           # window title follows the running command
set -g window-status-separator ""    # window pills provide their own spacing

# --- Copy mode --------------------------------------------------------------
setw -g mode-keys vi                 # vi-style copy mode bindings

# --- Session ----------------------------------------------------------------
set -g detach-on-destroy off         # keep the session alive when detached
set -g destroy-unattached off        # do not kill detached sessions
