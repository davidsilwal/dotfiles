# =============================================================================
#  theme.conf — colours, status bar, panes and popups
#
#  Loaded *after* the plugins, so the theme plugin's palette (@thm_*) is
#  already available. The palette is the single source of truth: change the
#  Catppuccin flavour in plugins.conf and the whole UI follows.
# =============================================================================

# --- Palette fallback -------------------------------------------------------
# The theme plugin sets these with "set -o" (only if not already set), so
# these values are used only when the theme plugin is missing. That keeps the
# status bar readable even on a machine without the plugin installed.
set -ogq @thm_fg          '#cdd6f4'
set -ogq @thm_base        '#1e1e2e'
set -ogq @thm_mantle      '#181825'
set -ogq @thm_crust       '#11111b'
set -ogq @thm_surface_0   '#313244'
set -ogq @thm_surface_1   '#45475a'
set -ogq @thm_surface_2   '#585b70'
set -ogq @thm_overlay_0   '#6c7086'
set -ogq @thm_overlay_1   '#7f849c'
set -ogq @thm_overlay_2   '#9399b2'
set -ogq @thm_subtext_0   '#bac2de'
set -ogq @thm_subtext_1   '#a6adc8'
set -ogq @thm_lavender    '#b4befe'
set -ogq @thm_blue        '#89b4fa'
set -ogq @thm_sapphire    '#74c7ec'
set -ogq @thm_sky         '#89dceb'
set -ogq @thm_teal        '#94e2d5'
set -ogq @thm_green       '#a6e3a1'
set -ogq @thm_yellow      '#f9e2af'
set -ogq @thm_peach       '#fab387'
set -ogq @thm_red         '#f38ba8'
set -ogq @thm_maroon      '#eba0ac'
set -ogq @thm_pink        '#f5c2e7'
set -ogq @thm_mauve       '#cba6f7'

# --- Status bar -------------------------------------------------------------
set -g status on
set -g status-position bottom
set -g status-justify left

# Width budget for the status line.
#
# tmux reserves status-left-length and status-right-length *before* handing
# the remaining columns to the window list. If the two limits together exceed
# the terminal width the status line overflows, wraps, and every redraw
# appends another line - the bar then marches down the screen, each copy
# shifted one column, and the window list is squeezed to nothing.
#
# 34 + 34 = 68 columns, which stays inside a 70 column terminal. The two
# status scripts adapt their content to the actual width, so the bar stays
# useful at 80 columns and gets richer on a wide one.
set -g status-left-length 34
set -g status-right-length 34
set -g status-style "bg=#{@thm_mantle},fg=#{@thm_fg}"

# Left: session pill, working directory, git branch.
# Right: cpu, memory, load, date, time.
#
# The client width is passed to the scripts as an argument on purpose.
# #{client_width} is expanded by tmux for the client the bar is being drawn
# for, so every terminal gets a bar sized for itself. The scripts must not
# look the width up with `tmux display-message` instead: that resolves
# against whichever client tmux considers current, so with two terminals of
# different sizes attached it reports the wrong one. The narrow terminal then
# gets a bar built for the wide one, the bar overflows and wraps, and because
# every redraw appends another copy it marches down the screen - the "pile of
# footer bars" that made this look like a rendering bug.
set -g status-left  "#(~/.config/tmux/scripts/status/left.sh #{client_width} #{session_name} #{pane_current_path})"
set -g status-right "#(~/.config/tmux/scripts/status/right.sh #{client_width} #{session_name} #{pane_current_path})"

# --- Panes ------------------------------------------------------------------
set -g pane-border-lines single
set -g pane-border-style "fg=#{@thm_surface_0}"
set -g pane-active-border-style "fg=#{@thm_mauve}"

# Show a title strip on top of every pane: number + running command.
set -g pane-border-status top
set -wg pane-border-format "#[fg=#{@thm_crust},bg=#{?pane_active,#{@thm_mauve},#{@thm_surface_1}}] #{pane_index} #[fg=#{?pane_active,#{@thm_fg},#{@thm_overlay_1}},bg=#{@thm_surface_0}] #{pane_current_command} #[none]"

# --- Messages, copy mode, menus --------------------------------------------
set -g message-style "fg=#{@thm_crust},bg=#{@thm_lavender},bold"
set -g message-command-style "fg=#{@thm_crust},bg=#{@thm_peach},bold"
set -g mode-style "fg=#{@thm_crust},bg=#{@thm_lavender},bold"
set -g clock-mode-colour "#{@thm_lavender}"

# --- Popups -----------------------------------------------------------------
set -g popup-style "bg=#{@thm_base},fg=#{@thm_fg}"
set -g popup-border-style "fg=#{@thm_lavender}"
set -g popup-border-lines single
