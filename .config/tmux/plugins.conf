# =============================================================================
#  plugins.conf — plugin list and per-plugin options
#
#  Managed with TPM (Tmux Plugin Manager). Install with prefix + I,
#  update with prefix + U, remove unused with prefix + M-u.
#
#  Every plugin below comes from the community list at
#  https://tmux.app/plugins/#essential-plugins
# =============================================================================

# --- Plugin manager ---------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'

# --- Sensible defaults ------------------------------------------------------
# Sane key bindings, larger scrollback, faster key response.
set -g @plugin 'tmux-plugins/tmux-sensible'

# --- Session persistence ----------------------------------------------------
# Saves the full session (windows, panes, layout, running programs) and
# restores it on demand.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'vi vim nvim'
set -g @resurrect-save-shell-history 'off'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# --- Automatic save / restore -----------------------------------------------
# Restores the last session when the tmux server starts, and saves it
# every 15 minutes.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @continuum-boot 'on'

# --- Clipboard --------------------------------------------------------------
# yank to the system clipboard from copy mode (uses OSC 52 over SSH).
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank-clipboard-on-copy 'on'
set -g @yank-primary 'off'

# --- Open URLs from the terminal --------------------------------------------
# prefix + u opens the URL under the cursor.
set -g @plugin 'tmux-plugins/tmux-urlview'

# --- Fuzzy finder -----------------------------------------------------------
# prefix + C-f opens a fuzzy menu for sessions, windows, panes and commands.
set -g @plugin 'sainnhe/tmux-fzf'
set-environment -g TMUX_FZF_LAUNCH_KEY 'C-f'

# --- Vim / Neovim integration ----------------------------------------------
# Ctrl+h/j/k/l move between tmux panes and Neovim splits alike.
set -g @plugin 'christoomey/vim-tmux-navigator'

# --- Smart text picking -----------------------------------------------------
# Highlights URLs, file paths, git SHAs and IPs in the pane; press the hint
# key to copy or open them.
set -g @plugin 'Morantron/tmux-fingers'
set -g @fingers-skip-wizard '1'
set -g @fingers-hl-bg 'default'
set -g @fingers-match-common 'on'
set -g @fingers-match-words 'on'
set -g @fingers-match-ip 'on'
set -g @fingers-match-path 'on'
set -g @fingers-match-url 'on'
set -g @fingers-match-sha 'on'
set -g @fingers-match-uuid 'on'

# --- Theme ------------------------------------------------------------------
# Catppuccin: the palette, pane borders, message style and the window pills
# are all driven from here. Change the flavour and the whole UI follows.
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @catppuccin_flavor 'mocha'

# Window list — "rounded" pills, muted when inactive, highlighted when active.
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_flags 'icon'
set -g @catppuccin_window_number_color '#{@thm_surface_2}'
set -g @catppuccin_window_text_color '#{@thm_surface_0}'
set -g @catppuccin_window_current_number_color '#{@thm_mauve}'
set -g @catppuccin_window_current_text_color '#{@thm_surface_1}'
set -g @catppuccin_window_number_position 'left'
# Cap the window title so a TUI that sets a long title cannot push the
# status line past the terminal width.
#
# `#T` is the *pane* title, which applications set to long descriptive
# strings ("OC | Professional tmux setup with plugins ...") - that is what
# made the status bar grow to 148 columns. The window *name* ("node",
# "opencode", "vim") is short, stable and more useful in a window list.
# #{=18:...} truncates it anyway as a safety net.
#
# The current window has its own option, and the active window is the one
# that usually carries the long title, so both have to be set.
set -g @catppuccin_window_text ' #{=18:#{window_name}}'
set -g @catppuccin_window_current_text ' #{=18:#{window_name}}'
set -g @catppuccin_status_left_separator ''
set -g @catppuccin_status_middle_separator ''
set -g @catppuccin_status_right_separator ' '
