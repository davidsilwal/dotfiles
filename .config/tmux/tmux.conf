# =============================================================================
#  ~/.config/tmux/tmux.conf - tmux 3.2+
#
#  Native configuration: no TPM, no plugin downloads, nothing to install
#  beyond tmux itself. Colours are the Catppuccin Mocha palette written out
#  inline, so the status bar does not depend on a plugin or a Nerd Font.
#
#  Prefix: Ctrl-a, and Ctrl-b as an alias (prefix2), so muscle memory from
#          either one works. Send a literal prefix with prefix + that key.
#  Reload: prefix + r        Health: tmux -f ~/.config/tmux/tmux.conf info
#
#  ~/.tmux.conf is a two-line loader that sources this file, so older tmux
#  builds and anything that insists on the old path behave identically.
# =============================================================================

# --- Prefix ------------------------------------------------------------------
# Ctrl-a is the primary prefix; Ctrl-b is tmux's default, kept working as a
# second prefix (`prefix2`, available since tmux 1.6) so neither habit breaks.
# Each key in the prefix table sends the literal key to the pane.
set -g prefix C-a
set -g prefix2 C-b
bind -T prefix C-a send-prefix
bind -T prefix C-b send-prefix -2

# --- Terminal ----------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm*:Tc"
set -g escape-time 10
set -g focus-events on
set -g assume-paste-time 1
set -g set-clipboard on

# --- Windows and panes -------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_command}'
setw -g mode-keys vi
# vi editing in the command prompt too (prefix + :), matching copy mode.
set -g status-keys vi
setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g mouse on

# --- Multiple terminals ------------------------------------------------------
# These two options only matter once a second terminal is attached to the same
# server, which is the normal case here: a wide SSH terminal and a narrow
# phone terminal share one session.
#
# window-size "latest" (the tmux default) sizes the window to whichever
# client attached most recently. The narrow phone then shrinks the window
# while the wide terminal still believes it has 186 columns, and tmux paints
# the wide terminal's empty right-hand region with the pane scrollbar - the
# screen fills with rows of "-", and a second, stale copy of the pane title
# strip is drawn lower down. "largest" sizes the window to the biggest
# client instead, so every client gets a window that fits inside it.
set -g window-size largest
# aggressive-resize does the same job for the window itself: off means the
# window follows the largest client rather than shrinking to the smallest.
# The two must agree, or they fight each other.
setw -g aggressive-resize off

# --- Status bar --------------------------------------------------------------
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=#cdd6f4,bg=#181825"
# tmux reserves status-left-length and status-right-length columns *before*
# handing the rest to the window list. If the two together exceed the
# terminal width, the window list is squeezed to nothing and the status line
# overflows, wraps, and on every redraw appends another copy - the bar marches
# down the screen. 24 + 52 = 76 leaves the window list room on an 80 column
# terminal and more on a wider one.
set -g status-left-length 24
set -g status-right-length 52
set -g status-left "#[fg=#181825,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#181825,nobold]"
set -g status-right "#[fg=#6c7086]#{?client_prefix,#[fg=#f9e2af]prefix #[fg=#6c7086],}#[fg=#bac2de]%H:%M #[fg=#6c7086]%d %b"

set -g window-status-separator ""
set -g window-status-format "#[fg=#6c7086] #I #[fg=#a6adc8]#W "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I #[fg=#1e1e2e,bg=#89b4fa]#W #[fg=#89b4fa,bg=#181825,nobold]"
set -g window-status-activity-style "fg=#f9e2af,bg=#181825"
set -g window-status-bell-style "fg=#f38ba8,bg=#181825,bold"
set -g window-status-last-style "fg=#cba6f7,bg=#181825"

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-status off

set -g message-style "fg=#1e1e2e,bg=#f9e2af"
set -g message-command-style "fg=#1e1e2e,bg=#89b4fa"
set -g mode-style "fg=#1e1e2e,bg=#f9e2af"
set -g display-time 2000

# --- Splits in the current directory -----------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- New windows and sessions in the current directory -----------------------
bind c new-window -c "#{pane_current_path}"
bind C new-session -c "#{pane_current_path}"

# --- Pane navigation (vim keys, plus arrows in copy mode) --------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable resize.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Even out the layout.
bind = select-layout -E

# --- Copy mode ---------------------------------------------------------------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# --- Housekeeping ------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"

# Swap windows without the prompt.
bind -r '<' swap-window -d -t -1
bind -r '>' swap-window -d -t +1

# Kill the current pane without confirmation; windows and sessions still ask.
bind x kill-pane

# --- Session persistence -----------------------------------------------------
# tmux-resurrect, vendored in plugins/ and cloned by setup.sh. State lives
# under ~/.local/state so `setup.sh --fresh` cannot delete saved sessions
# along with the configuration. Save with prefix + C-s, restore with prefix +
# C-r. (tmux-continuum's autosave/auto-restore needs TPM's environment and
# stays out by choice: manual keys plus a save before rebooting are enough.)
set -g @resurrect-dir '~/.local/state/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh vim nvim man less'

# Both plugins are bash scripts (they use BASH_SOURCE to find themselves), and
# tmux runs run-shell with /bin/sh, so they are invoked through bash. Guarded so
# a missing checkout or a host without bash prints nothing in the status line.
run-shell '[ -f "$HOME/.config/tmux/plugins/tmux-resurrect/resurrect.tmux" ] && command -v bash >/dev/null && bash "$HOME/.config/tmux/plugins/tmux-resurrect/resurrect.tmux" || true'

