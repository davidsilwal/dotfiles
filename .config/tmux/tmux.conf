# =============================================================================
#  tmux — professional developer configuration
# =============================================================================
#
#  Layout
#  ------
#    ~/.tmux.conf              thin loader (kept for older tmux / muscle memory)
#    ~/.config/tmux/tmux.conf  this file — the real entry point
#    ~/.config/tmux/options.conf   core tmux behaviour
#    ~/.config/tmux/plugins.conf   plugin list + plugin options
#    ~/.config/tmux/theme.conf     colours, status bar, panes, popups
#    ~/.config/tmux/keys.conf      key bindings
#    ~/.config/tmux/scripts/       helper scripts (status bar, popups)
#
#  tmux >= 3.2 reads ~/.config/tmux/tmux.conf in preference to ~/.tmux.conf,
#  so all real configuration lives under ~/.config/tmux and stays in one place.
#
#  Reload with:  prefix + r        (prefix is Ctrl-a)
# =============================================================================

# --- Where we live ----------------------------------------------------------
set -g @tmux_config_dir "$HOME/.config/tmux"
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# --- Modules ----------------------------------------------------------------
# Order matters:
#   1. options   — base tmux behaviour
#   2. plugins   — @plugin declarations and per-plugin options
#   3. theme     — colours + status bar (after the theme plugin has loaded)
#   4. keys      — key bindings (last, so they win over plugin bindings)
source-file ~/.config/tmux/options.conf
source-file ~/.config/tmux/plugins.conf

# Load every plugin declared above. This must happen after plugins.conf so the
# @plugin list is known, and before theme.conf so the theme's colours exist.
run '~/.tmux/plugins/tpm/tpm'

source-file ~/.config/tmux/theme.conf
source-file ~/.config/tmux/layout.conf
source-file ~/.config/tmux/keys.conf
