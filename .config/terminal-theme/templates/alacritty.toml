# =============================================================================
#  Alacritty — Catppuccin Mocha
#  Generated by ~/.config/terminal-theme/install.sh
# =============================================================================

[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

[font]
size = 14.0
normal = { family = "@FONT@", style = "Regular" }
bold = { family = "@FONT@", style = "Bold" }
italic = { family = "@FONT@", style = "Italic" }
bold_italic = { family = "@FONT@", style = "Bold Italic" }
offset = { x = 0, y = 0 }

[window]
decorations = "full"
opacity = 0.94
padding = { x = 8, y = 6 }
dynamic_padding = true
dynamic_title = true
option_as_title = true

[cursor]
style = { shape = "block", blinking = "on" }
unfocused_hollow = true

[scrolling]
history = 100000
multiplier = 3

[colors.primary]
background = "@BG@"
foreground = "@FG@"

[colors.cursor]
text = "@BG@"
cursor = "@CURSOR@"

[colors.selection]
text = "@SELECT_FG@"
background = "@SELECT_BG@"

[colors.search]
matches = { foreground = "@BG@", background = "@YELLOW@" }
focused_match = { foreground = "@BG@", background = "#b4befe" }

[colors.hints]
foreground = "@BG@"
background = "@CYAN@"

[colors.normal]
black = "@BLACK@"
red = "@RED@"
green = "@GREEN@"
yellow = "@YELLOW@"
blue = "@BLUE@"
magenta = "@MAGENTA@"
cyan = "@CYAN@"
white = "@WHITE@"

[colors.bright]
black = "@BR_BLACK@"
red = "@RED@"
green = "@GREEN@"
yellow = "@YELLOW@"
blue = "@BLUE@"
magenta = "@MAGENTA@"
cyan = "@CYAN@"
white = "@BR_WHITE@"
