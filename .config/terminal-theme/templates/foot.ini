# =============================================================================
#  foot — Catppuccin Mocha
#  Generated by ~/.config/terminal-theme/install.sh
# =============================================================================

[main]
font=@FONT@:size=14
dpi-aware=no

[colors]
background=@BG@
foreground=@FG@

regular0=@BLACK@
regular1=@RED@
regular2=@GREEN@
regular3=@YELLOW@
regular4=@BLUE@
regular5=@MAGENTA@
regular6=@CYAN@
regular7=@WHITE@

bright0=@BR_BLACK@
bright1=@RED@
bright2=@GREEN@
bright3=@YELLOW@
bright4=@BLUE@
bright5=@MAGENTA@
bright6=@CYAN@
bright7=@BR_WHITE@

[cursor]
color=@CURSOR@
text-color=@BG@

[selection]
background=@SELECT_BG@
foreground=@SELECT_FG@

[scrollbar]
enable=yes
length=3
color=@BR_BLACK@

[bell]
format=none
