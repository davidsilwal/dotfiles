# =============================================================================
#  Ghostty — Catppuccin Mocha
#  Generated by ~/.config/terminal-theme/install.sh
# =============================================================================

font-family = @FONT@
font-size = 14
bold-font-family = @FONT@
italic-font-family = @FONT@
bold-italic-font-family = @FONT@

theme = Catppuccin Mocha

background-opacity = 0.94
background-blur-radius = 20
window-padding-x = 8
window-padding-y = 6
window-padding-balance = true

cursor-style = block
cursor-style-blink = true

shell-integration = detect
shell-integration-features = cursor,screen,scrollback

scrollback-limit = 100000

confirm-close-surface = true
