# =============================================================================
#  Kitty — Catppuccin Mocha
#  Generated by ~/.config/terminal-theme/install.sh
# =============================================================================

# --- Font --------------------------------------------------------------------
font_family      @FONT@
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# --- Cursor ------------------------------------------------------------------
cursor            #cba6f7
cursor_text_color #1e1e2e
cursor_shape      block
cursor_blink      on

# --- Selection & URL ---------------------------------------------------------
selection_background #585b70
selection_foreground #cdd6f4
url_color            #89b4fa

# --- Bell / copy -------------------------------------------------------------
bell_on_urgent           false
copy_on_select           false
copy_with_clipboard      true
scrollback               100000
scrollback_pager         less --quit-if-one-screen

# --- Shell integration -------------------------------------------------------
shell_integration enabled
shell_integration_features cursor,screen,scrollback,notify
enabled_shell_integration   detect

# --- Padding -----------------------------------------------------------------
window_padding 8 6
draw_minimal_borders false
