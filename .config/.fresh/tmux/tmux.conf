# =============================================================================
#  ~/.config/tmux/tmux.conf - tmux 3.2+
#
#  Native configuration: no TPM, no plugin downloads, nothing to install
#  beyond tmux itself. Colours are the Catppuccin Mocha palette written out
#  inline, so the status bar does not depend on a plugin or a Nerd Font.
#
#  Prefix: Ctrl-a, and Ctrl-b as an alias (prefix2), so muscle memory from
#          either one works. Send a literal prefix with prefix + that key.
#  Reload: prefix + r        Health: tmux -f ~/.config/tmux/tmux.conf info
#
#  ~/.tmux.conf is a two-line loader that sources this file, so older tmux
#  builds and anything that insists on the old path behave identically.
# =============================================================================

# --- Prefix ------------------------------------------------------------------
# Ctrl-a is the primary prefix; Ctrl-b is tmux's default, kept working as a
# second prefix (`prefix2`, available since tmux 1.6) so neither habit breaks.
# Each key in the prefix table sends the literal key to the pane.
set -g prefix C-a
set -g prefix2 C-b
bind -T prefix C-a send-prefix
bind -T prefix C-b send-prefix -2

# --- Terminal ----------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm*:Tc"
set -g escape-time 10
set -g focus-events on
set -g assume-paste-time 1
set -g set-clipboard on

# Extended keys (kitty keyboard protocol). Without this tmux warns
# "tmux extended-keys is off" and modified Enter keys (Shift+Enter,
# Ctrl+Enter) may not reach the application. The outer terminal has to
# support the kitty protocol (CSI u) for this to have any effect.
set -g extended-keys on
# Send extended keys in CSI u form. The xterm default (modifyOtherKeys) is
# lossy and collapses the difference between keys such as Shift+Enter and
# Ctrl+Enter; pi and other TUI apps expect CSI u.
set -g extended-keys-format csi-u

# --- Windows and panes -------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_command}'
setw -g mode-keys vi
# vi editing in the command prompt too (prefix + :), matching copy mode.
set -g status-keys vi
setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g mouse on

# --- Multiple terminals ------------------------------------------------------
# These two options only matter once a second terminal is attached to the same
# server, which is the normal case here: a wide SSH terminal and a narrow
# phone terminal share one session.
#
# A session shared by a 186-column desktop and a 40-column phone has to pick
# one width. "largest" gives the phone a desktop-sized canvas, which it cannot
# draw: lines wrap and cursor addressing lands in the wrong column.
# "latest" flips the width every time a different client becomes active.
# "smallest" keeps the window inside every attached client, so the phone is
# correct and the desktop simply has empty space on the right; detaching the
# phone gives the space back. aggressive-resize applies the same rule to
# windows that are not currently on screen.
set -g window-size smallest
setw -g aggressive-resize on

# --- Panes --------------------------------------------------------------------
# tmux paints every cell a program does not: the space around a short line,
# the area under the last row, anything left over. Those cells take the
# terminal's own background, which is the emulator's choice and often not this
# palette -- an OSC 11 request is ignored by some clients. Setting the pane
# style makes tmux paint them itself, so the window is Catppuccin Mocha even
# when the emulator around it is not.
set -g window-style "fg=#cdd6f4,bg=#1e1e2e"
set -g window-active-style "fg=#cdd6f4,bg=#1e1e2e"

# --- Catppuccin theme --------------------------------------------------------
# Loaded before the status bar below, because the plugin defines the @thm_*
# palette and sets its own status styles; anything set after this point wins,
# which is how the bar keeps this repository's layout while taking the colours.
#
# Installed manually rather than through TPM: upstream recommends it (TPM
# names the checkout after the repository, "tmux", which collides with a
# directory of that name) and it keeps the theme loadable even when TPM is
# absent. setup.sh clones it at a pinned tag.
set -g @catppuccin_flavor "mocha"
# The guide's layout: rounded pills, the window name alone, and the plugin's own
# status background. The old configuration painted the bar with #1e1e2e hexes,
# which is why a correct palette looked identical to the theme it replaced.
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
run-shell "$HOME/.config/tmux/plugins/catppuccin/catppuccin.tmux"

# --- Status bar --------------------------------------------------------------
# The tutorial's bar: at the top, nothing on the left, and the Catppuccin
# application + session pills on the right. The modules are format strings the
# plugin defines; `#{E:...}` expands them where they are placed.
set -g status-interval 5
set -g status-position top
set -g status-justify left
# Responsive bar. A phone in Termius is often 40-60 columns and a laptop is
# 120+: a fixed bar either wraps (and marches down the screen) on the phone or
# wastes half the row on the laptop. These are client formats, so tmux
# re-evaluates them per attached client on every redraw:
#
#   < 60 columns   no right side at all; the window list gets the full row
#   60-99          the session pill only
#   >= 100         application and session pills, as in the tutorial
#
# `status-left-length` and `status-right-length` are upper bounds, not
# reservations: what a client actually renders is what the window list has to
# share the row with. 46 cells covers both pills (" zsh" + " default").
set -g status-left-length 0
set -g status-right-length 46
set -g status-left ""
# `#{e|>=:a,b}` is tmux's numeric comparison; `#{>=:a,b}` compares strings,
# where "40" sorts above "100" and every phone would look wide.
set -g status-right "#{?#{e|>=:#{client_width},100},#{E:@catppuccin_status_application},}#{?#{e|>=:#{client_width},60},#{E:@catppuccin_status_session},}"

set -g window-status-separator ""

set -g pane-border-style "fg=#{@thm_surface0}"
set -g pane-active-border-style "fg=#{@thm_blue}"
set -g pane-border-status off

set -g message-style "fg=#{@thm_crust},bg=#{@thm_yellow}"
set -g message-command-style "fg=#{@thm_crust},bg=#{@thm_blue}"
set -g mode-style "fg=#{@thm_crust},bg=#{@thm_yellow}"
set -g display-time 2000

# --- Splits in the current directory -----------------------------------------
# Standard tmux keys
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
# Intuitive aliases
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- New windows and sessions in the current directory -----------------------
bind c new-window -c "#{pane_current_path}"
bind C new-session -c "#{pane_current_path}"

# Sessionizer: pick a project directory and jump to a session named after it.
# A new window rather than a popup, because the script may need to create or
# attach a session and has to survive long enough for fzf to draw.
bind f new-window -c "#{pane_current_path}" "$HOME/.config/zsh/scripts/sessionizer.sh"

# --- Pane navigation (vim keys, plus arrows in copy mode) --------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable resize.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Even out the layout.
bind = select-layout -E

# --- Copy mode ---------------------------------------------------------------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# --- Sequences meant for the terminal ----------------------------------------
# `theme` (see zsh/scripts/theme.sh) changes the window's palette with OSC
# sequences from inside a pane. tmux swallows those by default; passthrough
# forwards them to the terminal that actually draws the window. The option
# arrived in 3.3 and this file also serves 3.2, where setting it would print
# "unknown option" on every load -- hence the guard. The comparison is
# numeric, so a future 3.10 reads as 3.1; the cost of that is only that
# passthrough stays off there.
%if #{>=:#{version},3.3}
set -g allow-passthrough on
%endif

# --- Housekeeping ------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"

# Swap windows without the prompt.
bind -r '<' swap-window -d -t -1
bind -r '>' swap-window -d -t +1

# Kill the current pane without confirmation; windows and sessions still ask.
bind x kill-pane

# --- Session persistence -----------------------------------------------------
# tmux-resurrect, vendored in plugins/ and cloned by setup.sh. State lives
# under ~/.local/state so `setup.sh --fresh` cannot delete saved sessions
# along with the configuration. Save with prefix + C-s, restore with prefix +
# C-r. (tmux-continuum's autosave/auto-restore needs TPM's environment and
# stays out by choice: manual keys plus a save before rebooting are enough.)
set -g @resurrect-dir '~/.local/state/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh vim nvim man less'

# Both plugins are bash scripts (they use BASH_SOURCE to find themselves), and
# tmux runs run-shell with /bin/sh, so they are invoked through bash. Guarded so
# a missing checkout or a host without bash prints nothing in the status line.
run-shell '[ -f "$HOME/.config/tmux/plugins/tmux-resurrect/resurrect.tmux" ] && command -v bash >/dev/null && bash "$HOME/.config/tmux/plugins/tmux-resurrect/resurrect.tmux" || true'


# --- Plugin manager ----------------------------------------------------------
# TPM is installed so plugins can be added with prefix + I without editing this
# file's loading logic. It has no plugins listed on purpose:
#
#   * tmux-sensible is omitted because it sets `status-keys emacs`
#     unconditionally, overriding the vi keys set above;
#   * tmux-yank is omitted because it shells out to xclip/xsel/wl-copy, none of
#     which exist on a VPS. `set-clipboard on` plus OSC 52 in the terminal
#     (alacritty forwards it) is the supported remote path, with no plugin;
#   * tmux-resurrect is loaded manually at the top of this file, because it is
#     a bash script and TPM's run-shell would hand it to /bin/sh.
set -g @plugin 'tmux-plugins/tpm'

# Keep every plugin under ~/.config instead of the legacy ~/.tmux/plugins, so
# `setup.sh --fresh` and the .gitignore rule cover them.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

# Install missing plugins with prefix + I, update with prefix + U.
run-shell "$HOME/.config/tmux/plugins/tpm/tpm"
