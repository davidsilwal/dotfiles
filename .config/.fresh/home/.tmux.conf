# =============================================================================
#  ~/.tmux.conf - loader for tmux builds that predate the XDG config path
#
#  tmux 3.2+ reads ~/.config/tmux/tmux.conf in preference to this file, so on
#  a current tmux this file is never read and nothing is loaded twice. It
#  exists only so an older tmux finds the same configuration.
# =============================================================================
source-file ~/.config/tmux/tmux.conf
