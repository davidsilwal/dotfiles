"$schema" = 'https://starship.rs/config-schema.json'

# Nothing below may walk the working tree on every prompt. Two costs used to be
# paid unconditionally: the os module probed the distribution (~50 ms) for one
# static icon, and each language module scanned the tree for file extensions.
# The icon is now a literal glyph in the format; the language modules are
# manifest-driven (see the block above [c]). scan_timeout stays as a backstop
# in case a module is ever given directory detection again.
scan_timeout = 10

format = """
[](red)\
[ ](bg:red fg:crust)\
$username\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$c\
$rust\
$golang\
$bun\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:green bg:lavender)\
$time\
[ ](fg:lavender)\
$cmd_duration\
$line_break\
$character"""

palette = 'catppuccin_mocha'

# The os module costs ~50 ms here (it probes the distribution on every
# prompt) for a single static icon, so the glyph is written into the format
# instead. U+F17C is the generic Linux mark, correct on both Arch and Ubuntu;
# swap it for U+F0548 if you would rather see the Ubuntu logo.
[os]
disabled = true

[username]
disabled = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[$user]($style)'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[nodejs]
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_extensions = []
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

# --- Language modules --------------------------------------------------------
#
# Every language module is enabled, so a Go, PHP, Java, C, Kotlin, Haskell or
# Bun project gets its badge. What is switched off is extension scanning:
# `detect_extensions = []` leaves each module with `detect_files` only, so it
# stats a handful of well-known manifests in the current directory instead of
# walking the tree. That walk was the ~50 ms cost, and it also produced false
# positives: a stray .js file in /tmp made the prompt claim a Node project and
# pay ~90 ms to ask node for a version.
#
# A badge still costs one spawn of the language's own tool when its manifest is
# present, because that is how the version is read (starship computes $version
# even when the format leaves it out). With a manifest there is something worth
# reporting, so that is the intended trade. Drop a badge with `disabled = true`.
[bun]
detect_files = ["bun.lockb", "bun.lock", "bunfig.toml"]
detect_extensions = []
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[c]
detect_files = ["CMakeLists.txt", "meson.build", "configure.ac"]
detect_extensions = []
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[rust]
detect_files = ["Cargo.toml"]
detect_extensions = []
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[golang]
detect_files = ["go.mod", "go.sum", "go.work"]
detect_extensions = []
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[php]
detect_files = ["composer.json", "composer.lock", ".php-version"]
detect_extensions = []
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[java]
detect_files = ["pom.xml", "build.gradle", "settings.gradle", ".java-version"]
detect_extensions = []
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[jj_bookmark]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $bookmark(@$remote)$diverged( \\(+$overflow_count others\\)) ](fg:crust bg:yellow)]($style)'

[jj_status]
style = "bg:yellow"
format = '[[($all )](fg:crust bg:yellow)]($style)'

[kotlin]
detect_files = ["build.gradle.kts", "settings.gradle.kts"]
detect_extensions = []
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[haskell]
detect_files = ["stack.yaml", "cabal.project", "package.yaml"]
detect_extensions = []
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]
detect_files = ["pyproject.toml", "requirements.txt", "setup.py", "setup.cfg", "Pipfile", ".python-version", "poetry.lock", "uv.lock", "environment.yml"]
detect_extensions = []
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

[conda]
disabled = true
symbol = "  "
style = "fg:crust bg:sapphire"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:lavender"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

