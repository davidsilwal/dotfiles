"$schema" = "https://starship.rs/config-schema.json"

# =============================================================================
#  ~/.config/zsh/starship.toml - Catppuccin Mocha, the tutorial's two lines
#
#  The format is the guide's: the directory on the first line, the prompt
#  character on the second, and git branch/status/duration on the right. The
#  previous powerline blocks were drawn with the same palette, which is why the
#  swap is a layout change rather than a colour change.
#
#  Every module below is cheap. Directory truncation is capped, and nothing
#  scans the tree for language manifests: a prompt that costs more than the
#  shell's spawn is noticed on every command.
# =============================================================================

add_newline = true
palette = "catppuccin_mocha"

format = """$directory$line_break$character"""
right_format = """$git_branch$git_status$cmd_duration"""

[directory]
style = "bold teal"
truncation_length = 3
truncate_to_repo = false
format = "[$path]($style) "

[character]
success_symbol = "[❯](bold mauve)"
error_symbol = "[❯](bold red)"

[git_branch]
style = "bold lavender"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold peach"
format = "([\\[$all_status$ahead_behind\\]]($style) )"

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "took [$duration]($style) "

# The os module probes the distribution on every prompt for one static icon;
# this prompt does not draw one.
[os]
disabled = true

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
