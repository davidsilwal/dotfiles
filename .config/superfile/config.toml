# =============================================================================
#  ~/.config/superfile/config.toml
#
#  superfile does not merge a partial file: a config that is missing a key
#  prints "missing fields: [...]" and applies nothing. So this is the full
#  schema from src/superfile_config/config.toml, with the values this machine
#  wants. Bump it against upstream when superfile adds a setting.
#
#  The theme is one of the files superfile ships (`theme/catppuccin-mocha.toml`),
#  not a palette copied here; the `theme/` directory stays out of git.
# =============================================================================

# --- Defaults ---------------------------------------------------------------

editor = "nvim"
dir_editor = "nvim"

# A background update check only ever delays the exit on a server.
auto_check_update = false

# `cd_on_quit` needs a shell wrapper around `spf`; the shell config does not
# install one, so leaving it on would silently do nothing.
cd_on_quit = false

default_open_file_preview = true
show_image_preview = true
show_panel_footer_info = true

default_directory = "."
file_size_use_si = false

default_sort_type = 0        # 0 Name, 1 Size, 2 Date, 3 Type, 4 Natural
sort_order_reversed = false
case_sensitive_sort = false
shell_close_on_success = false
page_scroll_size = 0
debug = false

# Do not hide a config/schema mismatch behind a warning: the warnings above
# are how the missing-field list becomes visible after an upgrade.
ignore_missing_fields = false

file_panel_extra_columns = 0
file_panel_name_percent = 50

# --- Styling ----------------------------------------------------------------

theme = "catppuccin-mocha"

# "bat" reuses the Catppuccin Mocha theme installed for previews, so a file
# preview and `bat` in a fzf window are the same colours. "" selects superfile's
# built-in chroma highlighter.
code_previewer = "bat"

# Requires a Nerd Font on the terminal that draws the window. Set to false when
# connecting from one that does not have it.
nerdfont = true
show_select_icons = true
transparent_background = false

file_preview_width = 4
enable_file_preview_border = true

sidebar_width = 20
sidebar_sections = ["home", "pinned", "disks"]

# One cell wide, or a space for a borderless layout.
border_top = '─'
border_bottom = '─'
border_left = '│'
border_right = '│'
border_top_left = '╭'
border_top_right = '╮'
border_bottom_left = '╰'
border_bottom_right = '╯'
border_middle_left = '├'
border_middle_right = '┤'

# --- Plugins ----------------------------------------------------------------

# `metadata` shells out to exiftool, which is not installed.
metadata = false
enable_md5_checksum = false

# zoxide is installed and tracked, so superfile's "jump to a visited directory"
# panel works.
zoxide_support = true

# --- File opening rules -----------------------------------------------------
# Must stay last: TOML cannot close this table.
[open_with]
