# =============================================================================
#  ~/.tmux.conf — loader
#
#  tmux 3.2+ reads ~/.config/tmux/tmux.conf in preference to this file, so
#  the real configuration lives in the XDG location. This shim keeps older
#  tmux versions (and anything that insists on ~/.tmux.conf) working by
#  sourcing exactly the same file.
#
#  See ~/.config/tmux/tmux.conf for the configuration itself.
# =============================================================================
source-file ~/.config/tmux/tmux.conf
